name: 'iceDQ Import'
description: 'Import an iceDQ rules or workflows bundle into a target workspace'
author: 'iceDQ Integration Team'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  icedq-base-url:
    description: 'iceDQ instance base URL'
    required: true
  keycloak-url:
    description: 'Keycloak token endpoint base'
    required: true
  client-id:
    description: 'OAuth client ID'
    required: true
  client-secret:
    description: 'OAuth client secret'
    required: true
  org-id:
    description: 'iceDQ Org ID'
    required: true
  account-id:
    description: 'iceDQ Account ID'
    required: true
  workspace-id:
    description: 'Target workspace ID'
    required: true
  bundle:
    description: 'Path to the export bundle ZIP'
    required: true
  kind:
    description: 'Bundle kind: rules or workflows'
    required: true
  mapping-file:
    description: 'Path to the mapping JSON (author by hand, or auto-generate with icedq-tools/generate-mapping-action)'
    required: true
  use-fqn:
    description: 'Set true to resolve by FQN instead of UUIDs'
    required: false
    default: 'false'
  strict:
    description: 'Fail the workflow if any rule is skipped'
    required: false
    default: 'true'
  terminate-on-conflict:
    description: 'Cancel any active import in the target workspace and retry'
    required: false
    default: 'false'
  timeout:
    description: 'Polling timeout in seconds'
    required: false
    default: '1800'
  cli-version:
    description: 'Pin a specific @icedq/cli version (default: latest)'
    required: false
    default: 'latest'
  verify-ssl:
    description: 'Verify TLS (default true)'
    required: false
    default: 'true'

outputs:
  task-id:
    description: 'iceDQ taskInstanceId of the import'
    value: ${{ steps.run-import.outputs.task-id }}
  status:
    description: 'Terminal status (Completed | Terminated | Error)'
    value: ${{ steps.run-import.outputs.status }}
  skipped-count:
    description: 'Number of skipped rules parsed from the import log'
    value: ${{ steps.run-import.outputs.skipped-count }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install @icedq/cli
      shell: bash
      run: npm install -g "@icedq/cli@${{ inputs.cli-version }}"

    - name: Run icedq import
      id: run-import
      shell: bash
      env:
        ICEDQ_BASE_URL: ${{ inputs.icedq-base-url }}
        ICEDQ_KEYCLOAK_URL: ${{ inputs.keycloak-url }}
        ICEDQ_CLIENT_ID: ${{ inputs.client-id }}
        ICEDQ_CLIENT_SECRET: ${{ inputs.client-secret }}
        ICEDQ_ORG_ID: ${{ inputs.org-id }}
        ICEDQ_ACCOUNT_ID: ${{ inputs.account-id }}
        ICEDQ_WORKSPACE_ID: ${{ inputs.workspace-id }}
        ICEDQ_VERIFY_SSL: ${{ inputs.verify-ssl }}
        BUNDLE: ${{ inputs.bundle }}
        KIND: ${{ inputs.kind }}
        MAPPING_FILE: ${{ inputs.mapping-file }}
        USE_FQN: ${{ inputs.use-fqn }}
        STRICT: ${{ inputs.strict }}
        TERMINATE_ON_CONFLICT: ${{ inputs.terminate-on-conflict }}
        TIMEOUT: ${{ inputs.timeout }}
      run: bash "${{ github.action_path }}/scripts/run-import.sh"

    - name: Upload import log artifact
      if: always() && hashFiles('icedq-import.log') != ''
      uses: actions/upload-artifact@v4
      with:
        name: icedq-import-log
        path: icedq-import.log
        if-no-files-found: ignore
